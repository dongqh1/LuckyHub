spring:
  application:
    name: luckyhub
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:luckyhub}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:luckyhub}
    password: ${MYSQL_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

luckyhub:
  shipping:
    address-key: ${SHIPPING_ADDRESS_KEY}
    address-key-version: v1
    claim-period: 7d
    callback-secret: ${SHIPPING_CALLBACK_SECRET}
    callback-window: 5m
    expiry-interval: 1m
    expiry-initial-delay: 60s
    batch-size: 50
  lottery:
    zone-id: Asia/Shanghai
    lock-wait: 3s
    processing-timeout: 2m
    reconcile-interval: 30s
    reconcile-initial-delay: 60s
    reconcile-batch-size: 100
    reconciliation-enabled: true
    reservation-retention: 72h
    outbox-interval: 5s
    outbox-initial-delay: 60s
    outbox-batch-size: 100
  messaging:
    enabled: true
    provider: redis-stream
    lottery-stream: luckyhub:stream:lottery
    lottery-group: luckyhub-lottery-consumers
    logical-consumer-name: lottery-core
    consumer-batch-size: 20
    consumer-poll-interval: 1s
    consumer-initial-delay: 60s
    claim-idle: 30s
    outbox-lease: 30s
  activity:
    status-refresh-interval: ${ACTIVITY_STATUS_REFRESH_INTERVAL:30000}
    status-refresh-initial-delay: ${ACTIVITY_STATUS_REFRESH_INITIAL_DELAY:0}
  oss:
    enabled: ${OSS_ENABLED:false}
    region: ${OSS_REGION:}
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    public-base-url: ${OSS_PUBLIC_BASE_URL:}
  security:
    password:
      bcrypt-strength: ${BCRYPT_STRENGTH:12}
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION}
  fulfillment:
    base-delay: 1s
    max-delay: 1m
    lease-duration: 30s
    poll-interval: 5s
    initial-delay: 60s
    batch-size: 50
    recovery-batch-size: 50
    projection-interval: 5s
    projection-initial-delay: 60s
